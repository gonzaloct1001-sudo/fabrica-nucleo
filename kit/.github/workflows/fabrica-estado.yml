name: Fábrica · estado

# Publica el estado del proyecto en el issue «Estado del proyecto», para que el estado vivo nunca dependa de que una
# sesión se cierre bien (.fabrica/nucleo/motor.md, "Dónde ver el estado"). Corre poco a propósito (núcleo 0.13.2): cada
# corrida cuesta al menos un minuto de Actions. Corre al integrar algo que cambia el estado (docs/ o .fabrica/), una vez
# al día y a mano; el estado al minuto lo da `estado.py` al iniciar una sesión.
on:
  push:
    branches: [main, master]
    paths: ['docs/**', '.fabrica/**']
  workflow_dispatch:
  schedule:
    - cron: '47 10 * * *'  # cada día, antes de la mañana en Chile: estado al día y respaldos wip/ que ya no sirven

permissions:
  contents: read

jobs:
  # Un solo trabajo: GitHub cobra al menos un minuto por cada uno
  publicar:
    runs-on: ubuntu-latest
    concurrency:
      group: fabrica-estado
      cancel-in-progress: true
    timeout-minutes: 5
    permissions:
      contents: write  # para borrar las ramas wip/ que ya no sirven
      issues: write
      pull-requests: read
      checks: read
    steps:
      # Siempre la rama principal: el estado es el de lo integrado, y un PR no puede cambiar el script
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Publicar el estado
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 .fabrica/scripts/estado.py --publicar

      - name: Borrar respaldos wip/ que ya no sirven
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 .fabrica/scripts/limpiar_wip.py --aplicar
