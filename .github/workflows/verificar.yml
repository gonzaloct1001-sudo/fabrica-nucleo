name: Verificar

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # En el repositorio del núcleo se comprueba además que no tenga datos de una instancia
      FABRICA_ES_NUCLEO: ${{ github.event.repository.name == 'fabrica-nucleo' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verificar la fábrica
        run: python3 .fabrica/scripts/verificar.py

      - name: Probar la actualización del núcleo
        run: python3 pruebas/probar_actualizacion.py

      - name: Probar clientes, proyectos y el kit
        run: python3 pruebas/probar_kit.py
