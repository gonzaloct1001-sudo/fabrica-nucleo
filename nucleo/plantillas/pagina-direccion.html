<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{titulo}}</title>
<meta name="description" content="{{descripcion}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<!--
  Página para la Dirección: lo que se le pide decidir, o lo que pasó en una jornada, en una sola página.
  La arma `.fabrica/scripts/bandeja.py --pagina` o `--jornada` con lo que hay en GitHub; las secciones marcadas
  «Por completar» las escribe quien la presenta, en lenguaje simple, antes de mostrarla (skill bandeja-direccion).
  Una instancia puede cambiar el estilo copiando esta plantilla a instancia/plantillas/pagina-direccion.html.
-->
<style>
:root {
  --bg: #f3f6f8;
  --surface: #ffffff;
  --ink: #16212c;
  --muted: #4c5a68;
  --line: #d3dbe2;
  --accent: #9a4f00;
  --accent-soft: #fff0da;
  --steel: #1d4b73;
  --ok: #1b6e3c;
  --ok-bg: #e3f3e9;
  --bad: #a8241c;
  --bad-bg: #fbe5e3;
  --display: "Barlow Semi Condensed", "Arial Narrow", "Segoe UI", sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e141a; --surface: #161f28; --ink: #e5ecf2; --muted: #9eaebd; --line: #2a3745;
    --accent: #f2a24c; --accent-soft: #352612; --steel: #8db7df;
    --ok: #63c98e; --ok-bg: #12301f; --bad: #f08a80; --bad-bg: #3a1714;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e141a; --surface: #161f28; --ink: #e5ecf2; --muted: #9eaebd; --line: #2a3745;
  --accent: #f2a24c; --accent-soft: #352612; --steel: #8db7df;
  --ok: #63c98e; --ok-bg: #12301f; --bad: #f08a80; --bad-bg: #3a1714;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.55;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 64px max(16px, env(safe-area-inset-left, 0px));
}
.col { max-width: 900px; margin: 0 auto; display: grid; gap: 48px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.12; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2rem, 5vw, 2.8rem); font-weight: 700; }
h2 { font-size: 1.6rem; font-weight: 700; }
p { margin: 0; max-width: 68ch; }
a { color: var(--accent); text-underline-offset: 3px; overflow-wrap: anywhere; }
a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
code { font-family: var(--mono); font-size: 0.86em; overflow-wrap: anywhere; }
.eyebrow { font-family: var(--mono); font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
header.top { border-bottom: 3px solid var(--steel); padding-block: 40px 24px; display: grid; gap: 12px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 22px; color: var(--muted); font-size: 0.95rem; }
.facts b { color: var(--ink); font-weight: 600; }
section { display: grid; gap: 16px; }
.texto { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 0.96rem; }
.completar { border: 2px dashed var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 14px 16px; color: var(--accent); font-weight: 600; }
.cifras { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.cifra { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 4px; }
.cifra b { font-family: var(--display); font-size: 2rem; line-height: 1; color: var(--steel); font-variant-numeric: tabular-nums; }
.cifra span { font-size: 0.92rem; color: var(--muted); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 8px; align-content: start; }
.card .v { font-family: var(--display); font-size: 1.2rem; font-weight: 600; line-height: 1.25; }
.card p { font-size: 0.95rem; color: var(--muted); }
.card .si { font-size: 0.9rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; }
.tag { justify-self: start; font-family: var(--mono); font-size: 0.75rem; padding: 2px 8px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.estado { display: inline-block; font-family: var(--mono); font-size: 0.8rem; padding: 2px 8px; border-radius: 4px; background: var(--line); color: var(--ink); }
.estado.ok { background: var(--ok-bg); color: var(--ok); }
.estado.mal { background: var(--bad-bg); color: var(--bad); }
ol.dia { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--line); }
ol.dia li { position: relative; padding: 0 0 20px 24px; display: grid; gap: 2px; }
ol.dia li::before { content: ""; position: absolute; left: -7px; top: 7px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--steel); }
ol.dia li:last-child { padding-bottom: 0; }
.hora { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); }
.que { font-weight: 600; }
.donde { font-size: 0.92rem; color: var(--muted); }
.tabla { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; font-family: var(--mono); font-size: 0.85rem; }
td .local { display: block; font-family: var(--mono); font-size: 0.78rem; color: var(--muted); overflow-wrap: anywhere; }
footer { color: var(--muted); font-size: 0.88rem; border-top: 1px solid var(--line); padding-top: 16px; }
</style>
</head>
<body>
<main class="col">
{{contenido}}
</main>
</body>
</html>
